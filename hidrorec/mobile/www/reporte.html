<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HidroRec | Reporte</title>
  <link rel="stylesheet" href="./css/global.css?v=20260406-2042">
  <link rel="stylesheet" href="./css/layout.css?v=20260406-2042">
  <link rel="stylesheet" href="./css/components.css?v=20260406-2042">
  <link rel="stylesheet" href="./css/reporte.css?v=20260406-2042">
  <script src="./js/mobile-config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="./index.html">
        <img src="./assets/logo/logo-hidrorec.png?v=20260330-1505" alt="Logo do HidroRec">
        <div class="brand__text">
          <strong>HidroRec</strong>
          <span>Monitoramento Urbano Inteligente</span>
        </div>
      </a>
      <div class="system-pill">Reporte</div>
    </div>
  </header>

  <div class="nav-shell">
    <div class="container nav-shell__inner">
      <nav class="nav-links">
        <a class="nav-link" href="./index.html">Inicio</a>
        <a class="nav-link" href="./previsoes.html">Previsoes</a>
        <a class="nav-link" href="./alertas.html">Alertas</a>
        <a class="nav-link hidden" id="account-nav-link" href="./conta.html">Conta</a>
        <a class="nav-link" href="./admin.html">Admin</a>
      </nav>
      <div class="nav-actions">
        <a class="button button--secondary" href="./index.html">Painel</a>
      </div>
    </div>
  </div>

  <main class="page">
    <div class="container">
      <section class="page-header">
        <span class="eyebrow">Reporte</span>
        <h1 class="page-title">Novo reporte</h1>
      </section>

      <section class="report-layout">
        <section class="card section-card">
          <form id="report-form" class="report-form">
            <article class="card card--soft location-card">
              <span class="eyebrow">Localizacao</span>
              <strong id="geo-status">Detectando GPS...</strong>
              <small id="geo-coordinates" class="muted">Aguardando permissao.</small>
            </article>

            <div class="field-grid">
              <div class="field">
                <label for="titulo">Titulo</label>
                <input id="titulo" name="titulo" type="text" placeholder="Alagamento na via" maxlength="120" required>
              </div>
              <div class="field">
                <label for="tipoOcorrencia">Tipo</label>
                <select id="tipoOcorrencia" name="tipoOcorrencia">
                  <option value="Microalagamento">Microalagamento</option>
                  <option value="Alagamento">Alagamento</option>
                  <option value="PontoAtencao">Ponto de atencao</option>
                  <option value="ObstrucaoDrenagem">Drenagem</option>
                  <option value="TrafegoComprometido">Trafego</option>
                </select>
              </div>
              <div class="field">
                <label for="bairro">Bairro</label>
                <input id="bairro" name="bairro" type="text" placeholder="Boa Viagem" maxlength="100" required>
              </div>
              <div class="field">
                <label for="regiao">Regiao</label>
                <input id="regiao" name="regiao" type="text" placeholder="Sul" maxlength="100" required>
              </div>
            </div>

            <div class="field">
              <label>Nivel da agua</label>
              <div class="water-grid" id="water-level-grid"></div>
              <div class="water-intensity">
                <div class="water-intensity__fill" id="water-intensity-fill"></div>
              </div>
            </div>

            <div class="field-grid">
              <div class="field">
                <label for="enderecoReferencia">Referencia</label>
                <input id="enderecoReferencia" name="enderecoReferencia" type="text" placeholder="Ponto de referencia" maxlength="180" required>
              </div>
              <div class="field">
                <label for="contatoUsuario">Contato</label>
                <input id="contatoUsuario" name="contatoUsuario" type="text" placeholder="(81) 99999-0000" maxlength="40">
              </div>
            </div>

            <div class="field-grid">
              <div class="field">
                <label for="nomeUsuario">Nome</label>
                <input id="nomeUsuario" name="nomeUsuario" type="text" placeholder="Seu nome" maxlength="120" required>
              </div>
              <div class="field">
                <label for="foto">Foto</label>
                <input id="foto" name="foto" type="file" accept="image/png,image/jpeg,image/webp">
              </div>
            </div>

            <div class="field">
              <label for="descricao">Descricao</label>
              <textarea id="descricao" name="descricao" placeholder="Descreva o local" minlength="10" maxlength="600" required></textarea>
            </div>

            <div class="field">
              <label for="observacoes">Observacoes</label>
              <textarea id="observacoes" name="observacoes" placeholder="Opcional" maxlength="600"></textarea>
            </div>

            <button id="submit-report" class="button button--primary" type="submit">Enviar</button>
          </form>
        </section>

        <aside class="grid">
          <article class="card section-card">
            <span class="eyebrow">Imagem</span>
            <h2 class="section-card__title">Previa</h2>
            <div class="image-preview" id="image-preview">
              <span class="muted">Nenhuma imagem.</span>
            </div>
          </article>
        </aside>
      </section>
    </div>
  </main>

  <footer class="page-footer">
    <div class="container page-footer__inner">
      <span>HidroRec</span>
      <span>Reporte</span>
    </div>
  </footer>

  <script type="module" src="./js/reporte.js?v=20260406-2042"></script>
</body>
</html>
