<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HidroRec | Previsoes</title>
  <link rel="stylesheet" href="./css/global.css?v=20260406-2112">
  <link rel="stylesheet" href="./css/layout.css?v=20260406-2112">
  <link rel="stylesheet" href="./css/components.css?v=20260406-2112">
  <link rel="stylesheet" href="./css/previsoes.css?v=20260406-2112">
  <script src="./js/mobile-config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="./index.html">
        <img src="./assets/logo/logo-hidrorec.png?v=20260330-1505" alt="Logo do HidroRec">
        <div class="brand__text">
          <strong>HidroRec</strong>
          <span>Monitoramento Urbano Inteligente</span>
        </div>
      </a>
      <div class="system-pill">Previsoes</div>
    </div>
  </header>

  <div class="nav-shell">
    <div class="container nav-shell__inner">
      <nav class="nav-links">
        <a class="nav-link" href="./index.html">Inicio</a>
        <a class="nav-link is-active" href="./previsoes.html">Previsoes</a>
        <a class="nav-link" href="./alertas.html">Alertas</a>
        <a class="nav-link hidden" id="account-nav-link" href="./conta.html">Conta</a>
        <a class="nav-link" href="./admin.html">Admin</a>
      </nav>
      <div class="nav-actions">
        <a class="button button--secondary" href="./reporte.html">Reportar</a>
      </div>
    </div>
  </div>

  <main class="page">
    <div class="container">
      <section class="page-header">
        <span class="eyebrow">Previsoes</span>
        <h1 class="page-title">Chuva e mare</h1>
      </section>

      <section class="card section-card forecast-brief">
        <div class="section-card__header">
          <div>
            <span class="eyebrow">Agora em Recife</span>
            <h2 class="section-card__title" id="forecast-current-title">Carregando...</h2>
          </div>
          <span class="muted" id="forecast-updated-at">--</span>
        </div>
        <p class="page-subtitle" id="forecast-current-reading">--</p>
        <small class="muted" id="forecast-current-recommendation">--</small>
      </section>

      <section class="card section-card forecast-brief forecast-brief--secondary">
        <div class="section-card__header">
          <div>
            <span class="eyebrow">Proximas 24h</span>
            <h2 class="section-card__title">Janela de acompanhamento</h2>
          </div>
        </div>
        <p class="page-subtitle" id="forecast-next-day">--</p>
      </section>

      <section class="cards-grid cards-grid--forecast" id="forecast-cards"></section>

      <section class="card section-card" style="margin-top: 20px;">
        <div class="section-card__header">
          <div>
            <span class="eyebrow">Janelas</span>
            <h2 class="section-card__title">Periodos criticos</h2>
          </div>
        </div>
        <div id="critical-windows" class="list-stack forecast-window-list"></div>
      </section>
    </div>
  </main>

  <footer class="page-footer">
    <div class="container page-footer__inner">
      <span>HidroRec</span>
      <span>Recife, PE</span>
    </div>
  </footer>

  <script type="module" src="./js/previsoes.js?v=20260406-2112"></script>
</body>
</html>
