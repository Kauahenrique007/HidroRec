<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HidroRec | Minha Conta</title>
  <link rel="stylesheet" href="./css/global.css?v=20260406-2042">
  <link rel="stylesheet" href="./css/layout.css?v=20260406-2042">
  <link rel="stylesheet" href="./css/components.css?v=20260406-2042">
  <link rel="stylesheet" href="./css/conta.css?v=20260406-2042">
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="./index.html">
        <img src="./assets/logo/logo-hidrorec.png?v=20260330-1505" alt="Logo do HidroRec">
        <div class="brand__text">
          <strong>HidroRec</strong>
          <span>Monitoramento Urbano Inteligente</span>
        </div>
      </a>
      <div class="system-pill">Conta</div>
    </div>
  </header>

  <div class="nav-shell">
    <div class="container nav-shell__inner">
      <nav class="nav-links">
        <a class="nav-link" href="./index.html">Inicio</a>
        <a class="nav-link" href="./previsoes.html">Previsoes</a>
        <a class="nav-link" href="./alertas.html">Alertas</a>
        <a class="nav-link is-active hidden" id="account-nav-link" href="./conta.html">Conta</a>
        <a class="nav-link" href="./admin.html">Admin</a>
      </nav>
      <div class="nav-actions nav-actions--session">
        <div class="session-summary">
          <span class="auth-chip" id="session-chip">Modo visitante</span>
          <strong id="session-profile-badge" class="session-profile-badge">Visitante</strong>
          <small id="session-user-label" class="session-user-label">Conta.</small>
        </div>
        <a class="button button--secondary" id="session-access-link" href="./acesso.html">Entrar</a>
        <a class="button button--ghost hidden" id="admin-shortcut-link" href="./admin.html">Painel</a>
        <button class="button button--ghost hidden" id="session-logout-button" type="button">Sair</button>
      </div>
    </div>
  </div>

  <main class="page">
    <div class="container">
      <section class="page-header conta-header">
        <div>
          <span class="eyebrow">Conta</span>
          <h1 class="page-title">Minha conta</h1>
        </div>
        <div class="card conta-hero-card">
          <span class="eyebrow">Conta</span>
          <strong>Perfil e historico</strong>
        </div>
      </section>

      <section class="conta-layout">
        <article class="card section-card conta-profile-card">
          <div class="section-card__header">
            <div>
              <span class="eyebrow">Perfil</span>
              <h2 class="section-card__title">Dados</h2>
            </div>
            <span class="auth-chip" id="conta-profile-chip">Sessao</span>
          </div>

          <form id="profile-form" class="stack-form">
            <div class="field-grid">
              <div class="field">
                <label for="profile-name">Nome</label>
                <input id="profile-name" type="text" maxlength="120" required>
              </div>
              <div class="field">
                <label for="profile-phone">Telefone</label>
                <input id="profile-phone" type="text" maxlength="40">
              </div>
            </div>
            <div class="field-grid">
              <div class="field">
                <label for="profile-email">E-mail</label>
                <input id="profile-email" type="email" disabled>
              </div>
              <div class="field">
                <label for="profile-role">Perfil</label>
                <input id="profile-role" type="text" disabled>
              </div>
            </div>
            <div class="conta-form-actions">
              <button id="profile-submit-button" class="button button--primary" type="submit">Salvar</button>
              <a class="button button--ghost" href="./reporte.html">Reporte</a>
            </div>
          </form>
        </article>

        <aside class="grid conta-side">
          <article class="card section-card">
            <span class="eyebrow">Resumo</span>
            <div class="metrics-grid conta-metrics" id="conta-metrics"></div>
          </article>

          <article class="card section-card">
            <span class="eyebrow">Sessao</span>
            <div class="list-stack">
              <div class="list-item">
                <strong id="conta-side-role">Conta ativa</strong>
              </div>
            </div>
          </article>
        </aside>
      </section>

      <section class="card section-card conta-history-card">
        <div class="section-card__header">
          <div>
            <span class="eyebrow">Historico</span>
            <h2 class="section-card__title">Reportes</h2>
          </div>
          <span class="muted" id="reportes-meta-label">--</span>
        </div>
        <div id="conta-reportes-list" class="list-stack"></div>
      </section>
    </div>
  </main>

  <footer class="page-footer">
    <div class="container page-footer__inner">
      <span>HidroRec</span>
      <span>Recife, PE</span>
    </div>
  </footer>

  <script type="module" src="./js/conta.js?v=20260406-2042"></script>
</body>
</html>
